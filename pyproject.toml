[project]
name = "evidence-grounded-rag-system"
version = "0.1.0"
description = "Hybrid retrieval, evidence-grounded generation with citations, abstention, and faithfulness evaluation over license-gated synthetic fixtures. Offline evaluation only; real corpus blocked."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Interactive demo (scripts/demo_*.py). Kept as an optional extra so the
# offline pipeline stays dependency-light.
demo = [
    "streamlit>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_grounded_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
