<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-grounded RAG system</title>
  <desc id="desc">RAG system in which every answer cites the passage that supports it. Citations are validated before an answer is shown and, without enough evidence, the system abstains with a stable reason code.</desc>

  <!-- Palette: the validation colors of the project's demo (green = valid citation, slate = abstention) on a solid dark surface, so it reads on GitHub light and dark. -->
  <rect width="1200" height="400" rx="28" fill="#0e151d"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="72" y="64" width="56" height="56" rx="14" fill="#7ee787"/>
    <text x="100" y="101" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#0e151d">[1]</text>
    <text x="146" y="101" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#7ee787">CITATION-VALIDATED RAG</text>
    <text x="72" y="200" font-size="60" font-weight="700" fill="#e6edf3"><tspan fill="#7ee787">Evidence</tspan>-grounded</text>
    <text x="72" y="266" font-size="60" font-weight="700" fill="#e6edf3">RAG system</text>
    <text x="72" y="322" font-size="22" fill="#9aa7b4">Every answer cites the passage that supports it.</text>
    <text x="72" y="354" font-size="22" fill="#9aa7b4">Without enough evidence, it abstains and says why.</text>
  </g>

  <g id="citation-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
    <rect x="744" y="44" width="400" height="320" rx="20" fill="#161f2a" stroke="#2c3a48" stroke-width="1.5"/>
    <text x="776" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.5" fill="#9aa7b4">CITED ANSWER</text>
    <text x="776" y="132" font-size="20" fill="#e6edf3">A permit application must</text>
    <text x="776" y="158" font-size="20" fill="#e6edf3">include a signed code of</text>
    <text x="776" y="184" font-size="20" fill="#e6edf3">conduct and a contact phone</text>
    <text x="776" y="210" font-size="20" fill="#e6edf3">number. <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" fill="#7ee787">[1]</tspan></text>
    <line x1="776" y1="230" x2="1112" y2="230" stroke="#2c3a48" stroke-width="1.5"/>
    <text x="776" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#9aa7b4">[1] doc-aurora-park-permits::1</text>
    <rect x="776" y="272" width="196" height="30" rx="15" fill="#12301f" stroke="#3fb950" stroke-width="1.5"/>
    <text x="792" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#7ee787">CITATIONS VALID</text>
    <line x1="776" y1="318" x2="1112" y2="318" stroke="#2c3a48" stroke-width="1.5"/>
    <text x="776" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b98a5">ABSTAINED · unsupported_query</text>
  </g>
</svg>
