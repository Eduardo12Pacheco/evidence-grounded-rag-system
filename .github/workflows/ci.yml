name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev --extra demo

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

  real-corpus:
    # Non-blocking: the approved local-only corpus is fetched from pinned
    # upstream URLs, so a network or upstream outage must not fail CI. When it
    # is available, the real-corpus behavior tests run instead of skipping.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev --extra demo

      - name: Acquire approved local-only corpus
        run: >-
          uv run python scripts/acquire_corpus.py
          --manifest data/manifests/corpus-source-v1.0.0.json

      - name: Test with the real local corpus
        run: uv run pytest -q
